# Validation profile only.
# Node-local HAProxy must be installed before init/join.
# Every Kubernetes node resolves k8s-api.crawl.internal to 127.0.0.1.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 10.4.4.12
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
  name: a1
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.31.14
controlPlaneEndpoint: k8s-api.crawl.internal:16443
networking:
  podSubnet: 192.168.0.0/16
  serviceSubnet: 10.96.0.0/12
apiServer:
  certSANs:
    - k8s-api.crawl.internal
    - 10.4.4.12
    - 10.4.4.3
    - 10.4.4.17
