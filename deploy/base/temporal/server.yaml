# enable-template
log:
  stdout: true
  level: info
persistence:
  # Fixed for this persistence cluster. Do not change after initialization.
  numHistoryShards: 128
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal_validation
        connectAddr: postgres-rw.crawl-validation.svc:5432
        connectProtocol: tcp
        user: '{{ env "SQL_USER" }}'
        password: '{{ env "SQL_PASSWORD" }}'
        maxConns: 2
        maxIdleConns: 1
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility_validation
        connectAddr: postgres-rw.crawl-validation.svc:5432
        connectProtocol: tcp
        user: '{{ env "SQL_USER" }}'
        password: '{{ env "SQL_PASSWORD" }}'
        maxConns: 2
        maxIdleConns: 1
        maxConnLifetime: 1h
global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: '{{ env "POD_IP" }}'
services:
  frontend:
    rpc: {grpcPort: 7233, membershipPort: 6933, bindOnIP: 0.0.0.0}
  history:
    rpc: {grpcPort: 7234, membershipPort: 6934, bindOnIP: 0.0.0.0}
  matching:
    rpc: {grpcPort: 7235, membershipPort: 6935, bindOnIP: 0.0.0.0}
  worker:
    rpc: {grpcPort: 7239, membershipPort: 6939, bindOnIP: 0.0.0.0}
clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: temporal:7233
dcRedirectionPolicy:
  policy: noop
archival:
  history: {state: disabled, enableRead: false}
  visibility: {state: disabled, enableRead: false}
namespaceDefaults:
  archival:
    history: {state: disabled}
    visibility: {state: disabled}
dynamicConfigClient:
  filepath: /etc/temporal/validation/dynamic.yaml
  pollInterval: 60s
