apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: temporal}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
          command: [temporal-server]
          args: [--root, /, --config, etc/temporal/validation, --env, server, --allow-no-auth, start]
          envFrom:
            - secretRef: {name: temporal-database}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - {name: GOMEMLIMIT, value: 512MiB}
            - {name: GOMAXPROCS, value: "2"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          ports:
            - {name: grpc, containerPort: 7233}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/temporal/validation, readOnly: true}
          startupProbe:
            grpc: {port: 7233, service: temporal.api.workflowservice.v1.WorkflowService}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            grpc: {port: 7233, service: temporal.api.workflowservice.v1.WorkflowService}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: config
          configMap: {name: temporal-config}
