apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-ingestor
spec:
  podSelector:
    matchLabels:
      app: data-ingestor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ingestor-query-client: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.4.4.2/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 10.4.4.2/32
        - ipBlock:
            cidr: 10.4.4.8/32
        - ipBlock:
            cidr: 10.4.4.5/32
      ports:
        - protocol: TCP
          port: 9092
