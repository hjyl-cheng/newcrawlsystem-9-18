global
    log stdout format raw local0
    maxconn 128
    nbthread 1

defaults
    mode tcp
    timeout connect 3s
    timeout client 2m
    timeout server 2m
    timeout check 3s

frontend s3
    bind :8333
    default_backend gateways

backend gateways
    balance roundrobin
    option httpchk
    http-check connect port 8333
    http-check send meth GET uri / ver HTTP/1.1 hdr Host seaweed-health
    http-check expect status 403
    http-check connect port 8888
    http-check send meth GET uri /crawlsystem-infra/ready ver HTTP/1.1 hdr Host filer
    http-check expect status 200
    default-server init-state fully-down inter 2s fall 2 rise 2 check
    server s1 10.4.4.2:8333
    server s2 10.4.4.8:8333
    server s3 10.4.4.5:8333

frontend health
    bind :8404
    mode http
    monitor-uri /ready
    monitor fail if { nbsrv(gateways) lt 1 }
    http-request return status 200 content-type text/plain string ok if { path /live }
    http-request deny
