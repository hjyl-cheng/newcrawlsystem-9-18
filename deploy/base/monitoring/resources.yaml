apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: docker.io/grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 20
          failureThreshold: 6
        env:
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_HOST
          value: postgres-rw.crawl-validation.svc:5432
        - name: GF_DATABASE_NAME
          value: crawler_grafana
        - name: GF_DATABASE_USER
          value: crawl_grafana
        - name: GF_DATABASE_SSL_MODE
          value: disable
        - name: GF_DATABASE_MAX_OPEN_CONN
          value: '10'
        - name: GF_DATABASE_MAX_IDLE_CONN
          value: '2'
        - name: GF_DATABASE_LOCKING_ATTEMPT_TIMEOUT_SEC
          value: '60'
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
          value: 'false'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        - name: GF_UNIFIED_ALERTING_EXECUTE_ALERTS
          value: 'false'
        - name: GF_SERVER_ROOT_URL
          value: http://localhost:3000/
        - name: GF_LOG_MODE
          value: console
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: grafana-dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        - name: cache
          mountPath: /var/lib/grafana
        - name: tmp
          mountPath: /tmp
        envFrom:
        - secretRef:
            name: grafana-private
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: grafana
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: cache
        emptyDir: {}
      - name: tmp
        emptyDir: {}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
