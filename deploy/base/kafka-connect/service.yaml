apiVersion: v1
kind: Service
metadata: {name: kafka-connect}
spec:
  selector: {app: kafka-connect}
  ports:
  - {name: rest, port: 8083, targetPort: rest}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: kafka-connect}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: kafka-connect}
