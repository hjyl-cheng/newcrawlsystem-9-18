global
    log stdout format raw local0
    maxconn 512
    nbthread 1
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 3s

frontend pg_direct
    bind :5432
    default_backend pg_primary

frontend pg_pooled
    bind :6432
    default_backend pgbouncer_primary

backend pg_primary
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions check-ssl verify required ca-file /etc/patroni-check/ca.crt crt /etc/patroni-check/client.pem
    server s1 10.4.4.2:5432 check port 8008 verifyhost s1
    server s2 10.4.4.8:5432 check port 8008 verifyhost s2
    server s3 10.4.4.5:5432 check port 8008 verifyhost s3

backend pgbouncer_primary
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions check-ssl verify required ca-file /etc/patroni-check/ca.crt crt /etc/patroni-check/client.pem
    server s1 10.4.4.2:6432 check port 8008 verifyhost s1
    server s2 10.4.4.8:6432 check port 8008 verifyhost s2
    server s3 10.4.4.5:6432 check port 8008 verifyhost s3

frontend health
    bind :8404
    mode http
    monitor-uri /ready
    monitor fail if { nbsrv(pg_primary) lt 1 }
    http-request return status 200 content-type text/plain string ok if { path /live }
    http-request deny
