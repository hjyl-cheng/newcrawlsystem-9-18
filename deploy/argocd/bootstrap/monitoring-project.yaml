apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: crawl-monitoring
  namespace: argocd
spec:
  sourceRepos:
  - https://github.com/hjyl-cheng/newcrawlsystem-9-18.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: crawl-monitoring
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: policy
    kind: PodDisruptionBudget
