modules:
  connect_tasks:
    metrics:
    - name: crawl_json_connect_tasks
      path: '{.tasks[*].id}'
      type: value
      help: Number of Kafka Connect tasks reported by the status API
      valuetype: gauge
    - name: crawl_json_connect_tasks_failed
      path: '{.tasks[?(@.state == "FAILED")].id}'
      type: value
      help: Number of Kafka Connect tasks reporting FAILED
      valuetype: gauge
