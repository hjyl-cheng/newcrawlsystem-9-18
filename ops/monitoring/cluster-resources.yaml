---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crawl-monitoring-state
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - pods
  - namespaces
  - persistentvolumeclaims
  - persistentvolumes
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - daemonsets
  - replicasets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crawl-monitoring-state
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crawl-monitoring-state
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: crawl-monitoring
