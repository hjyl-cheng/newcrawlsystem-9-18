apiVersion: v1
kind: PersistentVolume
metadata:
  name: crawl-prometheus-a2
  labels:
    crawl-monitoring-component: prometheus
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: crawl-monitoring-local
  local:
    path: /srv/crawlsystem/monitoring/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - a2
---
