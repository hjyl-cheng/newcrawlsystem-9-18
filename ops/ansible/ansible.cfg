[defaults]
inventory = inventory.yml
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
forks = 6

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/ubuntu/.ssh/known_hosts
pipelining = True
