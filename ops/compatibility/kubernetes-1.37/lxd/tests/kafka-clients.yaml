apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-client-config
  namespace: kafka-compat
data:
  client.properties: |
    security.protocol=SSL
    ssl.truststore.type=PKCS12
    ssl.truststore.location=/opt/kafka/cluster-ca/ca.p12
    ssl.keystore.type=PKCS12
    ssl.keystore.location=/opt/kafka/user/user.p12
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: kafka-compat
spec:
  containers:
    - name: kafka
      image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
      command: [sleep, "3600"]
      volumeMounts:
        - name: user
          mountPath: /opt/kafka/user
          readOnly: true
        - name: cluster-ca
          mountPath: /opt/kafka/cluster-ca
          readOnly: true
        - name: client-config
          mountPath: /opt/kafka/client-config
          readOnly: true
  volumes:
    - name: user
      secret:
        secretName: allowed-client
    - name: cluster-ca
      secret:
        secretName: k137-kafka-cluster-ca-cert
    - name: client-config
      configMap:
        name: kafka-client-config
---
apiVersion: v1
kind: Pod
metadata:
  name: blocked-client
  namespace: kafka-compat
spec:
  containers:
    - name: kafka
      image: quay.io/strimzi/kafka:1.2.0-kafka-4.3.1
      command: [sleep, "3600"]
      volumeMounts:
        - name: user
          mountPath: /opt/kafka/user
          readOnly: true
        - name: cluster-ca
          mountPath: /opt/kafka/cluster-ca
          readOnly: true
        - name: client-config
          mountPath: /opt/kafka/client-config
          readOnly: true
  volumes:
    - name: user
      secret:
        secretName: blocked-client
    - name: cluster-ca
      secret:
        secretName: k137-kafka-cluster-ca-cert
    - name: client-config
      configMap:
        name: kafka-client-config
