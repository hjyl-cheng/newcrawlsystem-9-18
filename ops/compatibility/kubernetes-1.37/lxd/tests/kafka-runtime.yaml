apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  namespace: kafka-compat
  labels:
    strimzi.io/cluster: k137-kafka
spec:
  replicas: 1
  roles: [broker, controller]
  storage:
    type: persistent-claim
    size: 2Gi
    class: k137-local
    deleteClaim: false
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  resources:
    requests:
      cpu: 200m
      memory: 640Mi
    limits:
      memory: 1Gi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: k137-kafka
  namespace: kafka-compat
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      group.initial.rebalance.delay.ms: 0
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: k137-events
  namespace: kafka-compat
  labels:
    strimzi.io/cluster: k137-kafka
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 3600000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: allowed-client
  namespace: kafka-compat
  labels:
    strimzi.io/cluster: k137-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      - operations: [Read, Write, Describe]
        resource:
          type: topic
          name: k137-events
          patternType: literal
      - operations: [Read, Describe]
        resource:
          type: group
          name: k137-test-group
          patternType: literal
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: blocked-client
  namespace: kafka-compat
  labels:
    strimzi.io/cluster: k137-kafka
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls: []
