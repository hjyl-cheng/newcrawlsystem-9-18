server:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector:
    kubernetes.io/hostname: crawl137-w1
  config:
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 4
      datastores:
        default:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            databaseName: temporal
            connectAddr: temporal-postgres.k137-temporal.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-database
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
        visibility:
          sql:
            createDatabase: true
            manageSchema: true
            pluginName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-postgres.k137-temporal.svc.cluster.local:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-database
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: 1h
    namespaces:
      create: true
      namespace:
        - name: k137-test
          retention: 1d

admintools:
  enabled: true
  nodeSelector:
    kubernetes.io/hostname: crawl137-w1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

web:
  enabled: false

schema:
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
