# Temporary client using Argo server's permitted network identity.
# Always NotReady so the argocd-server Service NEVER routes user traffic here.
apiVersion: v1
kind: Pod
metadata:
  name: argocd-cache-probe
  namespace: argocd
  labels: {app.kubernetes.io/name: argocd-server}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 180
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: redis-client
      image: docker.io/library/redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
      command: [sh, -c, "sleep 180"]
      env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef: {name: argocd-redis, key: auth}
      readinessProbe:
        exec: {command: [sh, -c, "exit 1"]}
        periodSeconds: 5
      resources:
        requests: {cpu: 5m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
