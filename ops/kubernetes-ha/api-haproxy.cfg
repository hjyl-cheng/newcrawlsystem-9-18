global
    maxconn 2048
    nbthread 1
    stats socket /run/crawl-kube-api/admin.sock mode 0600 level admin

defaults
    mode tcp
    timeout connect 3s
    timeout client 24h
    timeout server 24h
    timeout check 3s

frontend api
    bind 127.0.0.1:16443
    default_backend apiservers

backend apiservers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host k8s-api.crawl.internal
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions check-ssl verify required ca-file /etc/crawl-kube-api/ca.crt verifyhost k8s-api.crawl.internal
    server a1 10.4.4.12:6443 check
    server a2 10.4.4.3:6443 check
    server a3 10.4.4.17:6443 check
