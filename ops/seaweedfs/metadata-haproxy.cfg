global
    user haproxy
    group haproxy
    maxconn 64
    nbthread 1
    stats socket /run/crawl-seaweed-pg/admin.sock mode 600 level admin
    server-state-file /etc/seaweedfs/metadata-initial.state

defaults
    mode tcp
    timeout connect 3s
    timeout client 2m
    timeout server 2m
    timeout check 3s

frontend metadata_db
    bind 127.0.0.1:15432
    default_backend current_primary_pool

backend current_primary_pool
    load-server-state-from-file global
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions check-ssl verify required ca-file /etc/seaweedfs/patroni-check/ca.crt crt /etc/seaweedfs/patroni-check/client.pem
    server s1 10.4.4.2:6432 check port 8008 verifyhost s1
    server s2 10.4.4.8:6432 check port 8008 verifyhost s2
    server s3 10.4.4.5:6432 check port 8008 verifyhost s3
