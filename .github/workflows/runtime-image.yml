name: Runtime image
on:
  pull_request:
    paths: ['services/**', 'test/**', 'package*.json', 'tsconfig.json', '.node-version', '.npmrc', 'Dockerfile', '.dockerignore', '.github/workflows/runtime-image.yml']
  push:
    branches: [main]
    paths: ['services/**', 'test/**', 'package*.json', 'tsconfig.json', '.node-version', '.npmrc', 'Dockerfile', '.dockerignore', '.github/workflows/runtime-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/hjyl-cheng/newcrawlsystem-runtime:sha-${{ github.sha }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.version.outputs.value }}
      - name: Record immutable deployment reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/hjyl-cheng/newcrawlsystem-runtime@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
