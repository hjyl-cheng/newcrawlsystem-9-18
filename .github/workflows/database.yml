name: Database migrations
on:
  pull_request:
    paths: ['database/**', 'services/facts-store/**', 'services/ingestion/**', 'services/kafka-results/**', 'contracts/**', 'tsconfig.json', 'ops/db/**', 'test/database/**', 'package*.json', '.node-version', '.github/workflows/database.yml']
  push:
    branches: [main]
    paths: ['database/**', 'services/facts-store/**', 'services/ingestion/**', 'services/kafka-results/**', 'contracts/**', 'tsconfig.json', 'ops/db/**', 'test/database/**', 'package*.json', '.node-version', '.github/workflows/database.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: crawler_schema_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler_schema_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: crawler
      PGPASSWORD: ci-ephemeral-only
      PGDATABASE: crawler_schema_test_ci
      DB_EXPECTED_NAME: crawler_schema_test_ci
      DB_ALLOW_TEST_WRITES: crawler_schema_test_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:db
